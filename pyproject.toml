[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mmigram"
version = "0.2.0"
description = "Agentic AI System for Earthquake Intensity Estimation and StEER Reconnaissance Ingestion"
readme = "README.md"
authors = [{ name = "Jason Deng" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
live = [
    "google-genai>=2.30.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-aiplatform>=1.60.0",
    "pinecone-client>=3.0.0",
    "langchain-google-genai>=2.0.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "fastapi>=0.110.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
mmigram = "mmigram.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mmigram*"]
